[workspace]
resolver = "2"
members = ["crates/rune_core", "crates/runecaster"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
rand = "0.10"
rune_core = { path = "crates/rune_core" }

# Faster, smaller release builds for an actual game.
[profile.release]
opt-level = 3
lto = "thin"

# Optimize dependencies even in dev so Bevy runs at a playable framerate.
[profile.dev.package."*"]
opt-level = 3
